server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SvelteKit SPA — all non-file requests fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker — must always revalidate.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Immutable assets (content-hashed filenames) — cache forever.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Default HTML shell — always revalidate, with SPA fallback.
    location ~* \.html$ {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
