# AmityVox — sample nginx reverse proxy configuration.
#
# Use this when running AmityVox in external proxy mode and your reverse
# proxy is nginx. Adjust the upstream addresses, domain, and TLS settings
# to match your environment.
#
# The install script will tell you the exact ports after setup.
# Default ports: API=8080, WS=8081, Frontend=3000, LiveKit=7880.

# Upstream servers — replace 10.0.0.50 with the IP of your AmityVox host.
upstream amityvox_api {
    server 10.0.0.50:8080;
}

upstream amityvox_ws {
    server 10.0.0.50:8081;
}

upstream amityvox_web {
    server 10.0.0.50:3000;
}

upstream amityvox_rtc {
    server 10.0.0.50:7880;
}

server {
    listen 443 ssl http2;
    server_name chat.example.com;

    # --- TLS (adjust paths to your cert/key) ---
    ssl_certificate     /etc/nginx/ssl/chat.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/chat.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

    # --- Max upload size (match your AMITYVOX_MEDIA_MAX_UPLOAD_SIZE) ---
    client_max_body_size 550m;

    # --- REST API ---
    location /api/ {
        proxy_pass http://amityvox_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health check ---
    location = /health {
        proxy_pass http://amityvox_api;
        proxy_set_header Host $host;
    }

    # --- Federation discovery ---
    location = /.well-known/amityvox {
        proxy_pass http://amityvox_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Federation inbox ---
    location /federation/ {
        proxy_pass http://amityvox_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket gateway ---
    location = /ws {
        proxy_pass http://amityvox_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- LiveKit WebRTC signaling ---
    location /rtc {
        proxy_pass http://amityvox_rtc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend SPA (catch-all) ---
    location / {
        proxy_pass http://amityvox_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}
